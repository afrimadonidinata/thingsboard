name: Build Microservices

on: 
  push:
    branches:
      - release-4.2 
    paths:
      - 'application/**'
      - 'common/**'
      - 'dao/**'
      - 'msa/**'
      - 'rule-engine/**'
      - 'transport/**'
      - 'ui-ngx/**'
      - 'pom.xml'
      - '.github/workflows/separate-build.yml'
  pull_request:
    branches: 
     - release-4.2
  workflow_dispatch:
    inputs: 
      push_images:
        description: 'Push Docker images to registry'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/thingsboard

jobs:
  # Job 1: Build common modules and application
  build-base:
    name: Build Base Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version:  '17'
          cache: 'maven'

      - name: Format license headers
        run: mvn license:format -N
        continue-on-error: true
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build common modules
        run: |
          mvn clean install -DskipTests \
            -pl common/actor,common/cache,common/cluster-api,common/dao-api,common/data,common/message,common/queue,common/transport,common/util \
            -am

      - name: Build DAO module
        run: mvn clean install -DskipTests -pl dao -am

      - name: Build Rule Engine
        run: mvn clean install -DskipTests -pl rule-engine/rule-engine-api,rule-engine/rule-engine-components -am

      - name: Build Application module
        run: mvn clean install -DskipTests -pl application -am

      - name: Cache built artifacts
        uses: actions/cache@v4
        with: 
          path: |
            ~/.m2/repository/org/thingsboard
            application/target
          key: ${{ runner.os }}-tb-base-${{ github.sha }}

  # Job 2: Build Frontend (Angular UI)
  build-frontend:
    name: Build Web Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name:  Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ui-ngx/yarn.lock

      - name: Install dependencies
        working-directory: ui-ngx
        run: yarn install --frozen-lockfile

      - name: Build Angular production
        working-directory: ui-ngx
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          yarn build:prod

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-ngx-dist
          path: ui-ngx/target/generated-resources/public
          retention-days: 7

  # Job 3: Build Docker Images for Transport Services
  build-transport-services:
    name: Build Transport - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-base
    strategy:
      fail-fast: false
      matrix: 
        service: 
          - mqtt
          - http
          - coap
          - lwm2m
          - snmp
    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version:  '17'
          cache: 'maven'

      - name: Format license headers
        run: mvn license:format -N
        continue-on-error: true
      
      - name:  Restore cached artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/thingsboard
            application/target
          key: ${{ runner.os }}-tb-base-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name:  Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}-transport
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build transport module
        run: |
          mvn clean install -DskipTests \
            -pl transport/${{ matrix.service }} \
            -am

      - name: Build Docker image for ${{ matrix.service }} transport
        run: |
          mvn clean install -DskipTests \
            -Ddockerfile.skip=false \
            -pl msa/transport/${{ matrix.service }} \
            -am

      - name:  Tag and push Docker image
        if: github.event_name != 'pull_request' || github. event.inputs.push_images == 'true'
        run:  |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}-transport"
          docker tag thingsboard/tb-${{ matrix.service }}-transport:latest ${IMAGE_NAME}:${{ github.sha }}
          docker tag thingsboard/tb-${{ matrix.service }}-transport:latest ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:latest

  # Job 4: Build TB Node (Core Service)
  build-tb-node:
    name: Build TB Node (Core Service)
    runs-on: ubuntu-latest
    needs: build-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name:  Set up JDK 17
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Format license headers
        run: mvn license:format -N
        continue-on-error: true
      
      - name:  Restore cached artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/thingsboard
            application/target
          key: ${{ runner. os }}-tb-base-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses:  docker/metadata-action@v5
        with:
          images:  ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-node
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build TB Node Docker image
        run: |
          mvn clean install -DskipTests \
            -Ddockerfile.skip=false \
            -pl msa/tb-node \
            -am

      - name: Tag and push Docker image
        if:  github.event_name != 'pull_request' || github.event.inputs.push_images == 'true'
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env. IMAGE_PREFIX }}-node"
          docker tag thingsboard/tb-node:latest ${IMAGE_NAME}:${{ github.sha }}
          docker tag thingsboard/tb-node:latest ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:latest

  # Job 5: Build JS Executor
  build-js-executor: 
    name: Build JS Executor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name:  Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version:  '22'
          cache: 'yarn'
          cache-dependency-path: msa/js-executor/yarn.lock

      - name: Set up JDK 17
        uses:  actions/setup-java@v4
        with:
          distribution:  'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github. event.inputs.push_images == 'true'
        uses:  docker/login-action@v3
        with:
          registry:  ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-js-executor
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build JS Executor
        run: |
          mvn clean install -DskipTests \
            -Ddockerfile.skip=false \
            -pl msa/js-executor

      - name: Tag and push Docker image
        if: github.event_name != 'pull_request' || github.event.inputs. push_images == 'true'
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-js-executor"
          docker tag thingsboard/tb-js-executor:latest ${IMAGE_NAME}:${{ github.sha }}
          docker tag thingsboard/tb-js-executor:latest ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:latest

  # Job 6: Build Web UI Service
  build-web-ui:
    name: Build Web UI Service
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout code
        uses:  actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-ngx-dist
          path:  ui-ngx/target/generated-resources/public

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: msa/web-ui/yarn.lock

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses:  docker/metadata-action@v5
        with:
          images:  ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}. {{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Web UI Service
        run: |
          mvn clean install -DskipTests \
            -Ddockerfile.skip=false \
            -pl msa/web-ui

      - name: Tag and push Docker image
        if: github.event_name != 'pull_request' || github.event.inputs. push_images == 'true'
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-ui"
          docker tag thingsboard/tb-web-ui:latest ${IMAGE_NAME}:${{ github.sha }}
          docker tag thingsboard/tb-web-ui:latest ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:latest

  # Job 7: Build VC Executor
  build-vc-executor:
    name:  Build Version Control Executor
    runs-on: ubuntu-latest
    needs:  build-base
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses:  actions/setup-java@v4
        with:
          distribution:  'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Format license headers
        run: mvn license:format -N
        continue-on-error: true
      
      - name:  Restore cached artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/thingsboard
            application/target
          key: ${{ runner. os }}-tb-base-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github. event_name != 'pull_request' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name:  Build VC Executor
        run:  |
          mvn clean install -DskipTests \
            -Ddockerfile.skip=false \
            -pl msa/vc-executor-docker

      - name: Tag and push Docker image
        if: github. event_name != 'pull_request' || github.event.inputs.push_images == 'true'
        run: |
          IMAGE_NAME="${{ env. REGISTRY }}/${{ env.IMAGE_PREFIX }}-vc-executor"
          docker tag thingsboard/tb-vc-executor:latest ${IMAGE_NAME}:${{ github.sha }}
          docker tag thingsboard/tb-vc-executor:latest ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:latest

  # Job 8: Build Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: 
      - build-base
      - build-frontend
      - build-transport-services
      - build-tb-node
      - build-js-executor
      - build-web-ui
      - build-vc-executor
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Base Modules | ${{ needs.build-base.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Angular) | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Transport Services | ${{ needs.build-transport-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TB Node | ${{ needs.build-tb-node.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JS Executor | ${{ needs.build-js-executor.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web UI | ${{ needs.build-web-ui.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VC Executor | ${{ needs.build-vc-executor.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images are available at: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-*\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-node: latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-mqtt-transport:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-http-transport:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-coap-transport:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-lwm2m-transport: latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-snmp-transport:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-js-executor:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-web-ui:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`tb-vc-executor:latest\`" >> $GITHUB_STEP_SUMMARY